name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, migração e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sintravc
          POSTGRES_PASSWORD: sintravc
          POSTGRES_DB: sintravc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sintravc -d sintravc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://sintravc:sintravc@localhost:5432/sintravc
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migração num banco limpo
        run: pnpm db:migrar

      - name: Testes
        run: pnpm test
