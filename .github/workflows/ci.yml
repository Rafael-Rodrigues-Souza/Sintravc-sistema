name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, migração e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sintravc
          POSTGRES_PASSWORD: sintravc
          POSTGRES_DB: sintravc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sintravc -d sintravc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Recebe o e-mail do convite nos testes de ponta a ponta (E32).
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://sintravc:sintravc@localhost:5432/sintravc
      URL_SITE: http://localhost:3000
      # Só para o CI. Em homologação e produção, cada ambiente tem a sua (E36).
      BETTER_AUTH_SECRET: chave-do-ci-apenas-para-testes-com-mais-de-32-caracteres
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migração num banco limpo
        run: pnpm db:migrar

      - name: Testes
        run: pnpm test

  # Ponta a ponta em jobs separados, em paralelo (E48). O desktop (chromium, com o fluxo principal e a
  # varredura da janela) é um job próprio e sempre roda: uma falha num perfil não esconde uma falha
  # dele (fail-fast desligado). Os perfis de RESPONSIVO vão em grupos de dois.
  e2e:
    name: Ponta a ponta (${{ matrix.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: desktop
            id: desktop
            projetos: --project=chromium
          - nome: celulares
            id: celulares
            projetos: --project=celular-pequeno --project=celular
          - nome: em pé
            id: em-pe
            projetos: --project=tablet-em-pe --project=ipad-em-pe
          - nome: deitados
            id: deitados
            projetos: --project=ipad-deitado --project=tablet-deitado
          - nome: notebook e computador
            id: notebook-computador
            projetos: --project=notebook --project=computador

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sintravc
          POSTGRES_PASSWORD: sintravc
          POSTGRES_DB: sintravc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sintravc -d sintravc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Recebe o e-mail do convite nos testes de ponta a ponta (E32).
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://sintravc:sintravc@localhost:5432/sintravc
      URL_SITE: http://localhost:3000
      # Só para o CI. Em homologação e produção, cada ambiente tem a sua (E36).
      BETTER_AUTH_SECRET: chave-do-ci-apenas-para-testes-com-mais-de-32-caracteres
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Navegador dos testes de ponta a ponta
        run: pnpm exec playwright install --with-deps chromium

      # A Mídia grava no MinIO (E32). Não vai em `services` porque precisa do comando `server /data`.
      # A mesma imagem do docker-compose.yml; o bucket dos testes é criado em e2e/preparar.ts.
      - name: MinIO para a Mídia
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=sintravc -e MINIO_ROOT_PASSWORD=sintravc-segredo \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "O MinIO não respondeu." && docker logs minio && exit 1

      - name: Testes de ponta a ponta
        run: pnpm test:e2e ${{ matrix.projetos }}

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.id }}
          path: test-results/
          retention-days: 7
