name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, migração e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sintravc
          POSTGRES_PASSWORD: sintravc
          POSTGRES_DB: sintravc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sintravc -d sintravc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://sintravc:sintravc@localhost:5432/sintravc
      URL_SITE: http://localhost:3000
      # Só para o CI. Em homologação e produção, cada ambiente tem a sua (E36).
      BETTER_AUTH_SECRET: chave-do-ci-apenas-para-testes-com-mais-de-32-caracteres
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migração num banco limpo
        run: pnpm db:migrar

      - name: Testes
        run: pnpm test

      - name: Navegador dos testes de ponta a ponta
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: pnpm test:e2e

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 7
