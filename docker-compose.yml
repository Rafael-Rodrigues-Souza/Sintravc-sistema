# Ambiente de desenvolvimento (E32).
#
# Padrão — serviços no Docker, app no Windows:
#   docker compose up -d
#   pnpm dev
#
# Alternativo — app também no container:
#   docker compose --profile app up --build
#
# MinIO: usamos o fork da comunidade (pgsty/minio), porque as imagens oficiais
# minio/minio e minio/mc saíram do Docker Hub. A API é a mesma (S3).

name: sintravc

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sintravc
      POSTGRES_PASSWORD: sintravc
      POSTGRES_DB: sintravc
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sintravc -d sintravc"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # caixa de entrada: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sintravc
      MINIO_ROOT_PASSWORD: sintravc-segredo
    ports:
      - "9000:9000" # API S3 e URL pública dos arquivos
      - "9001:9001" # console: http://localhost:9001
    volumes:
      - minio:/data

  # Roda uma vez: espera o MinIO, cria o bucket e libera a leitura pública.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 sintravc sintravc-segredo >/dev/null 2>&1; do
          echo "Esperando o MinIO..."; sleep 1;
        done
        mc mb --ignore-existing local/sintravc
        mc anonymous set download local/sintravc
        echo "Bucket sintravc pronto."
    restart: "no"

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    # O store do pnpm fica no volume do node_modules (disco do Linux), não na pasta do Windows.
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile --store-dir /app/node_modules/.pnpm-store && pnpm dev --hostname 0.0.0.0
    env_file:
      - path: .env.local
        required: false
    environment:
      # Só os endereços mudam dentro da rede do compose; o resto vem do .env.local.
      DATABASE_URL: postgres://sintravc:sintravc@postgres:5432/sintravc
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_REMETENTE: SINTRAVC <nao-responda@sintravc.local>
      S3_ENDPOINT: http://minio:9000
      S3_REGIAO: us-east-1
      S3_BUCKET: sintravc
      S3_CHAVE_ACESSO: sintravc
      S3_CHAVE_SECRETA: sintravc-segredo
      S3_FORCAR_CAMINHO: "true"
      # A URL pública continua em localhost: é o navegador que abre o arquivo.
      S3_URL_PUBLICA: http://localhost:9000/sintravc
      # O script de teste confere a URL pública de dentro do container.
      S3_URL_PUBLICA_INTERNA: http://minio:9000/sintravc
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres:
  minio:
  app_node_modules:
  app_next:
